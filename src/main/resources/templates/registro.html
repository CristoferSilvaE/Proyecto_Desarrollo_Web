<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PowerFit - Crear Cuenta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["Montserrat", "sans-serif"] },
                    colors: {
                        brand: {
                            accent: "#a5b4fc",
                            hover: "#818cf8",
                            dark: "#0a0a0c",
                            card: "#18181b",
                            input: "#232326",
                            border: "#303038"
                        }
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-brand-dark text-white font-sans min-h-screen relative bg-cover bg-center"
    th:style="'background-image: linear-gradient(to bottom, rgba(10,10,12,0.88), rgba(10,10,12,0.96)), url(' + @{/imagenes/login1.jpg} + ');'">

    <header class="absolute top-0 left-0 w-full flex justify-between items-center px-8 py-6 z-20">
        <a th:href="@{/}" class="text-xl font-black tracking-tight text-white">POWERFIT</a>
        <a th:href="@{/}" class="text-[10px] tracking-[0.2em] uppercase text-gray-300 hover:text-brand-accent transition">← Volver al inicio</a>
    </header>

    <main class="min-h-screen flex items-center justify-center px-4 py-28">
        <section class="w-full max-w-2xl bg-brand-card/95 backdrop-blur-md border border-brand-border rounded-lg shadow-2xl p-8 md:p-10">
            <div class="text-center mb-9">
                <h1 class="text-4xl font-black tracking-tight text-white">POWERFIT</h1>
                <p class="mt-2 text-[10px] md:text-xs tracking-[0.22em] uppercase text-brand-accent">Crear cuenta atleta • Rendimiento máximo</p>
            </div>

            <form class="space-y-6" onsubmit="event.preventDefault()">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-[10px] font-bold tracking-[0.18em] uppercase text-gray-300 mb-2">Nombres *</label>
                        <input name="nombres" type="text" placeholder="Ej. Carlos" required maxlength="80"
                            class="w-full bg-brand-input border-b-2 border-gray-600 px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-brand-accent transition" />
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold tracking-[0.18em] uppercase text-gray-300 mb-2">Apellidos *</label>
                        <input name="apellidos" type="text" placeholder="Ej. Mendoza" required maxlength="80"
                            class="w-full bg-brand-input border-b-2 border-gray-600 px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-brand-accent transition" />
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-[10px] font-bold tracking-[0.18em] uppercase text-gray-300 mb-2">DNI / Documento *</label>
                        <input name="dni" type="text" placeholder="8 dígitos" required maxlength="8" pattern="[0-9]{8}" inputmode="numeric"
                            class="w-full bg-brand-input border-b-2 border-gray-600 px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-brand-accent transition" />
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold tracking-[0.18em] uppercase text-gray-300 mb-2">Fecha de nacimiento *</label>
                        <input name="fechaNacimiento" type="date" required
                            class="w-full bg-brand-input border-b-2 border-gray-600 px-4 py-3 text-sm text-gray-300 focus:outline-none focus:border-brand-accent transition [color-scheme:dark]" />
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-[10px] font-bold tracking-[0.18em] uppercase text-gray-300 mb-2">Teléfono / WhatsApp *</label>
                        <input name="telefono" type="tel" placeholder="+51 987 654 321" required maxlength="15"
                            class="w-full bg-brand-input border-b-2 border-gray-600 px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-brand-accent transition" />
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold tracking-[0.18em] uppercase text-gray-300 mb-2">Correo electrónico *</label>
                        <input name="correo" type="email" placeholder="atleta@ejemplo.com" required maxlength="120"
                            class="w-full bg-brand-input border-b-2 border-gray-600 px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-brand-accent transition" />
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-[10px] font-bold tracking-[0.18em] uppercase text-gray-300 mb-2">Contraseña *</label>
                        <input name="password" type="password" placeholder="••••••••" required minlength="8"
                            class="w-full bg-brand-input border-b-2 border-gray-600 px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-brand-accent transition" />
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold tracking-[0.18em] uppercase text-gray-300 mb-2">Confirmar contraseña *</label>
                        <input name="confirmarPassword" type="password" placeholder="••••••••" required minlength="8"
                            class="w-full bg-brand-input border-b-2 border-gray-600 px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-brand-accent transition" />
                    </div>
                </div>

                <label class="flex items-start gap-3 cursor-pointer text-sm text-gray-300">
                    <input type="checkbox" required class="mt-1 w-4 h-4 accent-indigo-300" />
                    <span>Acepto los <a href="#" class="text-brand-accent underline">Términos y Condiciones</a> y la <a href="#" class="text-brand-accent underline">Política de Privacidad</a>.</span>
                </label>

                <button type="submit" class="w-full py-4 bg-brand-accent hover:bg-brand-hover text-gray-950 font-black text-sm tracking-wider uppercase rounded shadow-lg transition">
                    Crear cuenta
                </button>
            </form>

            <div class="text-center mt-7 text-sm text-gray-400">
                ¿Ya tienes una cuenta?
                <a th:href="@{/login}" class="text-brand-accent font-semibold underline hover:text-white transition">Iniciar sesión</a>
            </div>
        </section>
    </main>
</body>
</html>
